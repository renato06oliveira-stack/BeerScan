<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeerScan</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
}
#reader{
width:300px;
margin:auto;
}
#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
button{
padding:15px;
font-size:18px;
margin-bottom:20px;
}
</style>
</head>

<body>

<h2>🍺 BeerScan</h2>

<button onclick="startScanner()">Escanear Produto</button>

<div id="reader"></div>

<div id="result">Clique em Escanear</div>

<script>

// ===== MARCAS =====
const marcas = {

CORONA:{
nome:"Cerveja Corona Extra",
categoria:"PREMIUM",
imagem:"https://i.imgur.com/HU3W2Q5.png"
}

};

// ===== SKUS =====
const skus = {

"7891991305846":"Cerveja Corona Extra",
"7891149108718":"Cerveja Corona Extra",
"7891149108749":"Cerveja Corona Extra"

};

let scanner;

// ===== INICIAR CAMERA =====
function startScanner(){

document.getElementById("result").innerHTML = "Abrindo câmera...";

scanner = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(devices => {

if(!devices || devices.length === 0){
alert("Nenhuma câmera encontrada");
return;
}

// tenta pegar câmera traseira
let cameraId = devices[0].id;

for(let device of devices){
if(
device.label.toLowerCase().includes("back") ||
device.label.toLowerCase().includes("traseira") ||
device.label.toLowerCase().includes("environment")
){
cameraId = device.id;
}
}

scanner.start(
cameraId,
{
fps:10,
qrbox:{width:250,height:150}
},

(decodedText)=>{

let codigo = decodedText.trim();

console.log("Código lido:", codigo);

// ===== VERIFICA PRODUTO =====
if(skus[codigo]){

let marcaKey = skus[codigo];
let produto = marcas[marcaKey];

document.getElementById("result").innerHTML = `
<h3>${produto.nome}</h3>
<p>Categoria: ${produto.categoria}</p>
<img src="${produto.imagem}" width="200">
`;

}else{

document.getElementById("result").innerHTML =
"❌ Produto não cadastrado";
}

scanner.stop();

},

(errorMessage)=>{
// ignora erros de leitura contínua
}
);

})
.catch(err=>{
console.log(err);
alert("Erro ao acessar câmera");
});

}

</script>

</body>
</html>
