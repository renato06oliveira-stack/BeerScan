<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeerScan</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
}
#reader{
width:320px;
margin:auto;
}
button{
padding:15px;
font-size:18px;
margin-bottom:20px;
}
</style>
</head>

<body>

<h2>🍺 BeerScan</h2>

<button id="startBtn">Escanear Produto</button>

<div id="reader"></div>

<div id="result">Clique em Escanear</div>

<script>

// ===== PRODUTOS =====

const marcas = {
CORONA:{
nome:"Cerveja Corona Extra",
categoria:"PREMIUM",
imagem:"https://i.imgur.com/HU3W2Q5.png"
};

HEINEKEN:{
nome:"Cerveja Heineken",
categoria:"PREMIUM",
imagem:"https://i.imgur.com/itFsfLF.png"
}
};

const skus = {
"7891991305846":"CORONA",
"7891149108718":"CORONA",
"7891149108749":"CORONA",

"7896045506590":"HEINEKEN",
"7896045506248":"HEINEKEN",
"78936683":"HEINEKEN",
"8712000025649":"HEINEKEN",
"78905498":"HEINEKEN",
"78935495":"HEINEKEN",
};

// ===== SCANNER =====

let scanner = null;

document.getElementById("startBtn").addEventListener("click", iniciarCamera);

function iniciarCamera(){

document.getElementById("reader").innerHTML = "";

scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode: { exact: "environment" } }, // FORÇA câmera traseira
{
fps:10,
qrbox:{width:250,height:250}
},
onScanSuccess,
onScanError
)
.catch(err=>{
alert("Erro ao abrir câmera: " + err);
});

}

// ===== LEITURA =====

function onScanSuccess(decodedText){

let codigo = decodedText.trim();

if(skus[codigo]){

let produto = marcas[skus[codigo]];

document.getElementById("result").innerHTML = `
<h3>${produto.nome}</h3>
<p>Categoria: ${produto.categoria}</p>
<img src="${produto.imagem}" width="200">
`;

}else{
document.getElementById("result").innerHTML =
"Produto não cadastrado";
}

scanner.stop();

}

function onScanError(error){
}

</script>

</body>
</html>
