<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeerScan</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
}
#reader{
width:300px;
margin:auto;
}
#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
button{
padding:15px;
font-size:18px;
margin-bottom:20px;
}
</style>
</head>

<body>

<h2>🍺 BeerScan</h2>

<button onclick="startScanner()">Escanear Produto</button>

<div id="reader"></div>

<div id="result">Clique em Escanear</div>

<script>

const marcas = {

CORONA:{
nome:"Cerveja Corona Extra",
categoria:"PREMIUM",
imagem:"https://i.imgur.com/HU3W2Q5.png"
},

};

 const skus = {

"7891991305846":"CORONA",
"7891149108718":"CORONA",
"7891149108749":"CORONA", 

 }; 

let scanner;

function startScanner(){

if(scanner){
scanner.stop().catch(()=>{});
}

scanner = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

if(!devices.length){
alert("Nenhuma câmera encontrada");
return;
}

let cameraId = devices[0].id;

devices.forEach(device => {
if(device.label.toLowerCase().includes("back") ||
device.label.toLowerCase().includes("traseira") ||
device.label.toLowerCase().includes("environment")){
cameraId = device.id;
}
});

<script>

let scanner;

function startScanner(){

if(scanner){
scanner.stop().catch(()=>{});
}

scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode: "environment" }, // força câmera traseira
{
fps:10,
qrbox:{ width:250, height:250 },
formatsToSupport:[
Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E
]
},
(decodedText)=>{

let codigo = decodedText.trim();

if(skus[codigo]){

let marcaKey = skus[codigo];
let produto = marcas[marcaKey];

document.getElementById("result").innerHTML = `
<h3>${produto.nome}</h3>
<p>Categoria: ${produto.categoria}</p>
<img src="${produto.imagem}" width="200">
`;

}else{

document.getElementById("result").innerHTML =
"Produto não cadastrado";

}

scanner.stop();

},
(error)=>{}
);

}

</script>
